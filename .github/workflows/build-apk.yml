name: Build APK

# Собирает установочный APK прямо в GitHub (вкладка Actions -> Build APK -> Artifacts).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comencryptbwt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже предустановлен на ubuntu-latest (ANDROID_HOME); только принимаем лицензии
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # local.properties в репозитории содержит чужой локальный путь к SDK -> убираем его
      - name: Remove local.properties
        run: rm -f local.properties

      # При загрузке через веб-интерфейс GitHub флаг исполняемости у gradlew теряется
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EncryptDecrypt-debug-apk
          path: comencryptbwt/app/build/outputs/apk/debug/*.apk
